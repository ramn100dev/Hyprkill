# Hyprkill — yazi config
# Abre con SUPER+E (kitty yazi). Previews via kitty graphics protocol.

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
title_format   = "Yazi: {cwd}"

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 1200
max_height    = 1200
image_delay   = 30
image_filter  = "triangle"
image_quality = 90

# Abridores: texto -> neovim; el resto -> la app por defecto (loupe, vlc, brave...)
[opener]
edit = [
	{ run = 'nvim "$@"', desc = "Editar", block = true, for = "unix" },
]
open = [
	{ run = 'xdg-open "$@"', desc = "Abrir", for = "linux" },
]
reveal = [
	{ run = 'xdg-open "$(dirname "$0")"', desc = "Mostrar en gestor", for = "linux" },
]

[open]
prepend_rules = [
	{ url = "*.lua", use = "edit" },
	{ mime = "text/*", use = "edit" },
	{ mime = "application/{json,toml,yaml,x-yaml,javascript}", use = "edit" },
	{ mime = "application/x-{shellscript,wine-extension-ini}", use = "edit" },
	{ mime = "{image,audio,video}/*", use = "open" },
]
