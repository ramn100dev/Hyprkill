# hypridle — inactividad: atenúa brillo, bloquea, apaga pantalla y suspende.
# Portátil HP OMEN 16: el brillo de pantalla es el device por defecto (amdgpu_bl2),
# así que brightnessctl funciona sin -d. Se quitó el teclado MSI 'msiacpi::kbd_backlight'
# (era del PC anterior y NO existe en este equipo: hacía fallar los comandos).

general {
    lock_cmd = ~/.local/bin/lock.sh                                          # lock CON vídeo (el script evita duplicar)
    before_sleep_cmd = loginctl lock-session                                # bloquea ANTES de suspender (seguridad)
    after_sleep_cmd = hyprctl dispatch dpms on; ~/.local/bin/lock.sh revive  # enciende pantalla y reanima el vídeo
    ignore_dbus_inhibit = false                 # respeta inhibidores (vídeo/navegador a pantalla completa no atenúan)
}

# 4 min -> atenúa el brillo (guarda el actual con -s y lo restaura con -r al volver)
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 6 min -> bloquea (hyprlock, tu reloj VCR)
listener {
    timeout = 360
    on-timeout = loginctl lock-session
}

# 6.5 min -> apaga la pantalla
listener {
    timeout = 390
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on; ~/.local/bin/lock.sh revive
}

# 15 min -> suspende a RAM
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
